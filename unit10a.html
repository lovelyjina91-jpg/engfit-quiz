<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 10-A. 주격 보어 (명사/형용사) - 어순 배열</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #ffe4ec 0%, #ffc4d6 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #ff8aab 0%, #e85d85 100%);
    color: #fff;
    padding: 24px 28px;
    position: relative;
  }
  header .unit-badge {
    display: inline-block;
    background: #2e7d4f;
    color: #fff;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  header h1 { font-size: 24px; font-weight: 800; }
  header p { font-size: 14px; margin-top: 6px; opacity: 0.95; }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px;
    background: #fef4f7;
    border-bottom: 1px solid #ececec;
    font-size: 14px;
    font-weight: 600;
    color: #555;
  }
  .status-bar .score { color: #2e7d4f; }
  .status-bar .progress-num { color: #e85d85; }

  .question-box { padding: 26px 28px 8px; }
  .korean-sentence {
    background: #f3faf5;
    border-left: 4px solid #2e7d4f;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 17px;
    color: #1f4d33;
    font-weight: 500;
    margin-bottom: 18px;
  }
  .korean-sentence::before {
    content: "🇰🇷 우리말: ";
    color: #2e7d4f;
    font-weight: 700;
  }
  .answer-area {
    min-height: 64px;
    background: #fff5f8;
    border: 2px dashed #e85d85;
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
    align-content: flex-start;
    margin-bottom: 16px;
  }
  .answer-area:empty::after {
    content: "👇 아래 단어 카드를 순서대로 눌러 문장을 만들어 보세요";
    color: #c44a72;
    font-size: 14px;
    margin: auto;
  }
  .word-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 0 4px;
    min-height: 64px;
  }
  .word-card {
    background: #fff;
    border: 2px solid #e85d85;
    color: #8a1d4a;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    user-select: none;
  }
  .word-card:hover { background: #ffe4ec; transform: translateY(-1px); }
  .word-card.placed {
    background: #2e7d4f;
    border-color: #1f5b39;
    color: #fff;
  }
  .word-card.placed:hover { background: #266940; }

  .button-row {
    display: flex;
    gap: 10px;
    padding: 0 28px 26px;
    flex-wrap: wrap;
  }
  button.action {
    flex: 1;
    min-width: 110px;
    border: none;
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  button.check { background: #2e7d4f; color: #fff; }
  button.check:hover { background: #1f5b39; }
  button.reset { background: #fff; color: #8a1d4a; border: 2px solid #e85d85; }
  button.reset:hover { background: #ffe4ec; }
  button.next { background: #e85d85; color: #fff; }
  button.next:hover { background: #c44a72; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }

  .feedback {
    margin: 0 28px 22px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.6;
    display: none;
  }
  .feedback.correct {
    background: #e6f7ec;
    border-left: 4px solid #2e7d4f;
    color: #1f5b39;
  }
  .feedback.wrong {
    background: #fdecea;
    border-left: 4px solid #d93025;
    color: #8a1d12;
  }
  .feedback strong { font-weight: 800; }
  .feedback .answer-line {
    margin-top: 6px;
    background: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Georgia', serif;
    color: #222;
    font-size: 15px;
  }

  .final-screen {
    display: none;
    padding: 40px 28px;
    text-align: center;
  }
  .final-screen h2 { font-size: 26px; color: #c44a72; margin-bottom: 12px; }
  .final-screen .score-big {
    font-size: 56px;
    font-weight: 800;
    color: #e85d85;
    margin: 16px 0;
  }
  .final-screen .comment {
    font-size: 16px;
    color: #555;
    margin-bottom: 24px;
  }
  .final-screen button {
    padding: 14px 32px;
    background: #2e7d4f;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .final-screen button:hover { background: #1f5b39; }

  footer {
    text-align: center;
    padding: 14px;
    font-size: 12px;
    color: #999;
    background: #fafaf6;
    border-top: 1px solid #eee;
  }

  @media (max-width: 480px) {
    body { padding: 10px; }
    header h1 { font-size: 20px; }
    .question-box, .button-row { padding-left: 18px; padding-right: 18px; }
    .word-card { font-size: 15px; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="unit-badge">UNIT 10 - A</span>
    <h1>주격 보어 — 명사/형용사 어순 배열</h1>
    <p>주격 보어 어순: <strong>주어 + be동사·감각동사·상태동사 + 명사/형용사</strong></p>
  </header>

  <div class="status-bar" id="statusBar">
    <span>📘 문제 <span class="progress-num" id="progressNum">1</span> / 10</span>
    <span>점수 <span class="score" id="scoreNum">0</span> / 10</span>
  </div>

  <div id="quizArea">
    <div class="question-box">
      <div class="korean-sentence" id="koreanSentence"></div>
      <div class="answer-area" id="answerArea"></div>
      <div class="word-pool" id="wordPool"></div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="button-row">
      <button class="action reset" id="resetBtn">↺ 다시</button>
      <button class="action check" id="checkBtn">✓ 정답 확인</button>
      <button class="action next" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <div class="final-screen" id="finalScreen">
    <h2>🎉 모든 문제를 다 풀었어요!</h2>
    <div class="score-big"><span id="finalScore">0</span> / 10</div>
    <p class="comment" id="finalComment"></p>
    <button onclick="restartQuiz()">🔄 새 문제 다시 풀기</button>
  </div>

  <footer>Unit 10-A 주격 보어 · 중학교 기초 · be동사/become/look/smell/taste 등 + 명사·형용사</footer>
</div>

<script>
  // 10 questions: subject complements (S + linking verb + N/Adj)
  const QUESTIONS = [
    {
      ko: "Jane은 내 여자친구다.",
      words: ["Jane", "is", "my", "girlfriend"],
      answer: "Jane is my girlfriend"
    },
    {
      ko: "Juyoung은 나의 가장 친한 친구다.",
      words: ["Juyoung", "is", "my", "best", "friend"],
      answer: "Juyoung is my best friend"
    },
    {
      ko: "꿈은 이루어진다.",
      words: ["Dreams", "come", "true"],
      answer: "Dreams come true"
    },
    {
      ko: "그녀는 판사가 되었다.",
      words: ["She", "became", "a", "judge"],
      answer: "She became a judge"
    },
    {
      ko: "날씨가 점점 추워지고 있다.",
      words: ["The", "weather", "is", "getting", "colder"],
      answer: "The weather is getting colder"
    },
    {
      ko: "너 오늘 슬퍼 보여.",
      words: ["You", "look", "sad", "today"],
      answer: "You look sad today"
    },
    {
      ko: "그 빵집은 항상 달콤한 냄새가 난다.",
      words: ["The", "bakery", "always", "smells", "sweet"],
      answer: "The bakery always smells sweet"
    },
    {
      ko: "지구가 점점 따뜻해지고 있다.",
      words: ["The", "earth", "is", "becoming", "warmer"],
      answer: "The earth is becoming warmer"
    },
    {
      ko: "Miller 선생님은 오늘 매우 피곤해 보인다.",
      words: ["Mr.", "Miller", "looks", "very", "tired", "today"],
      answer: "Mr. Miller looks very tired today"
    },
    {
      ko: "할머니의 치즈케이크는 항상 맛있다.",
      words: ["My", "grandmother's", "cheesecake", "always", "tastes", "good"],
      answer: "My grandmother's cheesecake always tastes good"
    }
  ];

  let currentOrder = [];
  let currentIdx = 0;
  let score = 0;
  let placed = [];
  let currentQ = null;
  let answered = false;
  let scoredThisRound = false;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startQuiz() {
    currentOrder = shuffle([...Array(QUESTIONS.length).keys()]);
    currentIdx = 0;
    score = 0;
    document.getElementById('finalScreen').style.display = 'none';
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('statusBar').style.display = 'flex';
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    scoredThisRound = false;
    placed = [];
    const qIndex = currentOrder[currentIdx];
    currentQ = QUESTIONS[qIndex];

    document.getElementById('progressNum').textContent = currentIdx + 1;
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('koreanSentence').textContent = currentQ.ko;
    document.getElementById('answerArea').innerHTML = '';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('checkBtn').disabled = false;

    const wordIndices = shuffle([...Array(currentQ.words.length).keys()]);
    const pool = document.getElementById('wordPool');
    pool.innerHTML = '';
    wordIndices.forEach(idx => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.textContent = currentQ.words[idx];
      card.dataset.idx = idx;
      card.addEventListener('click', () => onWordClick(card));
      pool.appendChild(card);
    });

    document.getElementById('nextBtn').textContent =
      (currentIdx === QUESTIONS.length - 1) ? '결과 보기 🏁' : '다음 →';
  }

  function onWordClick(card) {
    if (answered) return;
    const idx = parseInt(card.dataset.idx);
    if (card.classList.contains('placed')) {
      card.classList.remove('placed');
      placed = placed.filter(i => i !== idx);
    } else {
      card.classList.add('placed');
      placed.push(idx);
    }
    renderAnswerArea();
  }

  function renderAnswerArea() {
    const area = document.getElementById('answerArea');
    area.innerHTML = '';
    placed.forEach(idx => {
      const span = document.createElement('div');
      span.className = 'word-card placed';
      span.textContent = currentQ.words[idx];
      span.dataset.idx = idx;
      span.addEventListener('click', () => {
        if (answered) return;
        placed = placed.filter(i => i !== idx);
        const poolCard = document.querySelector(`#wordPool .word-card[data-idx="${idx}"]`);
        if (poolCard) poolCard.classList.remove('placed');
        renderAnswerArea();
      });
      area.appendChild(span);
    });
  }

  function checkAnswer() {
    if (answered) return;
    if (placed.length !== currentQ.words.length) {
      alert('단어를 모두 사용해서 문장을 완성해 주세요!');
      return;
    }
    answered = true;
    document.getElementById('checkBtn').disabled = true;
    document.getElementById('nextBtn').disabled = false;

    const userSentence = placed.map(i => currentQ.words[i]).join(' ');
    const fb = document.getElementById('feedback');
    if (userSentence === currentQ.answer) {
      if (!scoredThisRound) { score++; scoredThisRound = true; }
      document.getElementById('scoreNum').textContent = score;
      fb.className = 'feedback correct';
      fb.innerHTML = `<strong>✅ 정답입니다! 잘했어요!</strong>
        <div class="answer-line">${currentQ.answer}.</div>`;
    } else {
      fb.className = 'feedback wrong';
      fb.innerHTML = `<strong>❌ 아쉬워요. 정답은 다음과 같아요:</strong>
        <div class="answer-line">${currentQ.answer}.</div>
        <div style="margin-top:6px; font-size:13px; color:#666;">
        💡 <b>주격 보어 어순:</b> 주어 + 동사 + <b>명사/형용사 보어</b> (감각동사 뒤엔 부사가 아닌 형용사!)
        </div>`;
    }
    fb.style.display = 'block';
  }

  function resetCurrent() {
    if (answered) return;
    placed = [];
    document.querySelectorAll('#wordPool .word-card').forEach(c => c.classList.remove('placed'));
    renderAnswerArea();
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx >= QUESTIONS.length) {
      showFinal();
    } else {
      loadQuestion();
    }
  }

  function showFinal() {
    document.getElementById('quizArea').style.display = 'none';
    document.getElementById('statusBar').style.display = 'none';
    document.getElementById('finalScreen').style.display = 'block';
    document.getElementById('finalScore').textContent = score;
    let comment = '';
    if (score === 10) comment = '완벽해요! 🌟 주격 보어 어순을 완전히 마스터했네요!';
    else if (score >= 8) comment = '아주 잘했어요! 👏 감각동사 + 형용사 패턴이 손에 익었네요!';
    else if (score >= 6) comment = '잘했어요! 😊 헷갈렸던 문제를 다시 한번 살펴봐요.';
    else if (score >= 4) comment = '괜찮아요! 💪 감각동사 뒤에는 부사 X, 형용사 O 기억!';
    else comment = '천천히 한 번 더 풀어 봐요. 🙂 be/become/look/smell/taste + 명사·형용사!';
    document.getElementById('finalComment').textContent = comment;
  }

  function restartQuiz() { startQuiz(); }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('resetBtn').addEventListener('click', resetCurrent);
  document.getElementById('nextBtn').addEventListener('click', nextQuestion);

  startQuiz();
</script>
</body>
</html>
