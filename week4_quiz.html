<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 단어 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a3a8a;
      --light-blue: #3b5fd4;
      --pale: #eef1ff;
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f2f4fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
    }

    .container { width: 100%; max-width: 480px; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── 공통 카드 ── */
    .card {
      background: white;
      border: 2.5px solid var(--blue);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 6px 24px rgba(26,58,138,.10);
    }

    /* ── 스타트 화면 ── */
    .logo {
      text-align: center;
      margin-bottom: 4px;
    }
    .brand-name {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.5em;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 2px;
      opacity: 0.55;
      margin-bottom: 6px;
    }
    .brand-tag {
      font-family: 'Patrick Hand', cursive;
      font-size: 0.95em;
      font-weight: 700;
      color: var(--blue);
      opacity: 0.4;
      letter-spacing: 1.5px;
      text-align: right;
      margin-bottom: 10px;
    }
    .smiley {
      display: inline-block;
      width: 56px; height: 56px;
      border: 2.5px solid var(--blue);
      border-radius: 50%;
      font-size: 28px;
      line-height: 52px;
      margin-bottom: 8px;
    }
    .app-title {
      font-family: 'Patrick Hand', cursive;
      font-size: 2.2em;
      color: var(--blue);
      font-weight: 700;
      text-align: center;
    }
    .app-sub {
      text-align: center;
      font-size: 0.78em;
      color: #888;
      margin: 4px 0 20px;
      letter-spacing: 0.5px;
    }
    .badge {
      display: inline-block;
      background: var(--pale);
      color: var(--blue);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.82em;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* 모드 선택 */
    .section-label {
      font-size: 0.78em;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .opt-btn {
      flex: 1;
      padding: 10px 6px;
      border: 2px solid var(--blue);
      border-radius: 10px;
      background: white;
      color: var(--blue);
      font-size: 0.82em;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: all .18s;
      font-weight: 500;
    }
    .opt-btn.active {
      background: var(--blue);
      color: white;
    }

    .start-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Patrick Hand', cursive;
      font-size: 1.3em;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform .15s;
    }
    .start-btn:hover { transform: scale(1.02); }

    /* ── 퀴즈 화면 ── */
    .prog-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .prog-text { font-size: 0.78em; color: #888; }
    .score-text { font-size: 0.78em; color: var(--blue); font-weight: 600; }

    .prog-bar {
      background: #dde2f4;
      border-radius: 4px;
      height: 6px;
      margin-bottom: 18px;
    }
    .prog-fill {
      background: var(--blue);
      height: 100%;
      border-radius: 4px;
      transition: width .3s;
    }

    .q-card {
      background: white;
      border: 2.5px solid var(--blue);
      border-radius: 18px;
      padding: 32px 22px;
      text-align: center;
      margin-bottom: 14px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .q-label {
      font-size: 0.72em;
      color: #999;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .q-word {
      font-family: 'Patrick Hand', cursive;
      font-size: 2.6em;
      color: var(--blue);
      font-weight: 700;
      line-height: 1.2;
      word-break: break-word;
    }
    .q-word.kr-mode {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.65em;
      font-weight: 700;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .choice-btn {
      background: white;
      border: 2px solid var(--blue);
      border-radius: 12px;
      padding: 13px 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.96em;
      color: var(--blue);
      cursor: pointer;
      transition: background .12s, border-color .12s;
      line-height: 1.4;
      min-height: 54px;
      word-break: keep-all;
    }
    .choice-btn.en-choice {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.44em;
    }
    .choice-btn:hover:not(:disabled) { background: var(--pale); }
    .choice-btn:disabled { cursor: default; }
    .choice-btn.correct {
      background: #dcfce7 !important;
      border-color: var(--green) !important;
      color: var(--green) !important;
    }
    .choice-btn.wrong {
      background: #fee2e2 !important;
      border-color: var(--red) !important;
      color: var(--red) !important;
    }

    /* ── 결과 화면 ── */
    .result-top {
      text-align: center;
      margin-bottom: 24px;
    }
    .score-ring {
      width: 96px; height: 96px;
      border: 4px solid var(--blue);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .score-pct {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.8em;
      color: var(--blue);
      font-weight: 700;
      line-height: 1;
    }
    .score-sub { font-size: 0.68em; color: #999; margin-top: 2px; }

    .result-title {
      font-family: 'Patrick Hand', cursive;
      font-size: 2em;
      color: var(--blue);
    }
    .result-stats { font-size: 0.85em; color: #666; margin-top: 4px; }

    .wrong-title {
      font-size: 0.83em;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 8px;
    }
    .wrong-list {
      background: white;
      border: 2px solid var(--blue);
      border-radius: 12px;
      padding: 4px 14px;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 14px;
    }
    .wrong-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      gap: 8px;
    }
    .wrong-item:last-child { border-bottom: none; }
    .wi-en {
      font-family: 'Patrick Hand', cursive;
      font-size: 1.12em;
      color: var(--blue);
      font-weight: 600;
      flex-shrink: 0;
    }
    .wi-kr { font-size: 0.8em; color: #555; text-align: right; }

    .copy-btn {
      display: block; width: 100%;
      background: var(--blue); color: white;
      border: none; border-radius: 12px;
      padding: 14px; font-size: 0.9em;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer; margin-bottom: 9px;
      transition: opacity .15s;
    }
    .copy-btn:hover { opacity: .88; }

    .retry-btn {
      display: block; width: 100%;
      background: white; color: var(--blue);
      border: 2px solid var(--blue); border-radius: 12px;
      padding: 12px; font-size: 0.88em;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      transition: background .15s;
    }
    .retry-btn:hover { background: var(--pale); }

    .copied-msg {
      text-align: center;
      font-size: 0.82em;
      color: var(--green);
      margin-top: 6px;
      height: 18px;
    }

    /* 분리선 */
    .divider { border: none; border-top: 1px solid #e8eaf4; margin: 18px 0; }

    /* 스크롤바 */
    .wrong-list::-webkit-scrollbar { width: 4px; }
    .wrong-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 2px; }
    .wrong-list::-webkit-scrollbar-thumb { background: #c0c8e8; border-radius: 2px; }
  </style>
</head>

<div class="container">

  <!-- ══ 스타트 화면 ══ -->
  <div id="startScreen" class="screen active">
    <div class="card">
      <div class="logo">
        <div class="brand-name">EngFit</div>
      </div>
      <div class="app-title">Week 4 단어 테스트</div>
      <div class="app-sub">순서 · 넣기 · 무관한문장 · 요약문</div>
      <div style="text-align:center">
        <span class="badge" id="totalBadge">총 000개 단어</span>
      </div>

      <div style="font-size:0.8em; color:#999; margin-bottom:16px;">영어 ↔ 한국어 랜덤 출제 · 매번 새로운 구성</div>

      <div class="section-label" style="text-align:center; margin-bottom:10px;">파트 선택 <span id="partSizeLabel" style="font-weight:400;"></span></div>
      <div class="mode-row">
        <button class="opt-btn" onclick="startQuiz(0)">Part 1</button>
        <button class="opt-btn" onclick="startQuiz(1)">Part 2</button>
        <button class="opt-btn" onclick="startQuiz(2)">Part 3</button>
        <button class="opt-btn" onclick="startQuiz(3)">Part 4</button>
      </div>
    </div>
  </div>

  <!-- ══ 퀴즈 화면 ══ -->
  <div id="quizScreen" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
      <div class="brand-tag" style="margin-bottom:0;">EngFit</div>
      <span id="partTag" style="font-size:0.8em;color:#aaa;font-family:'Patrick Hand',cursive;letter-spacing:1px;">Part -</span>
    </div>
    <div class="prog-row">
      <span class="prog-text" id="progText">0 / 0</span>
      <span class="score-text" id="scoreText">✅ 0</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

    <div class="q-card">
      <div class="q-label" id="qLabel">다음 단어의 뜻은?</div>
      <div class="q-word" id="qWord"></div>
    </div>

    <div class="choices" id="choices"></div>
  </div>

  <!-- ══ 결과 화면 ══ -->
  <div id="resultScreen" class="screen">
    <div class="card">
      <div class="result-top">
        <div class="score-ring">
          <div class="score-pct" id="scorePct">0%</div>
          <div class="score-sub">정답률</div>
        </div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-stats" id="resultStats"></div>
      </div>

      <hr class="divider">

      <div id="wrongSection">
        <div class="wrong-title">❌ 틀린 단어</div>
        <div class="wrong-list" id="wrongList"></div>
      </div>

      <hr class="divider">

      <button class="copy-btn" onclick="copyResult()">📋 결과 복사하기 (카카오톡 전송용)</button>
      <div class="copied-msg" id="copiedMsg"></div>
      <button class="retry-btn" onclick="showStart()">🔄 다시 테스트하기</button>
      <div style="text-align:center; margin-top:14px;">
        <span class="brand-name" style="font-size:1.1em;">EngFit</span>
      </div>
    </div>
  </div>

</div>

// ────────────────────────────────────────────────
//  앱 상태
// ────────────────────────────────────────────────
let quizWords = []; // [word, isEnKr]
let current = 0;
let correctCount = 0;
let wrongWords = [];
let currentPart = 1;

// ────────────────────────────────────────────────
//  초기화
// ────────────────────────────────────────────────
document.getElementById('totalBadge').textContent = `총 ${allWords.length}개 단어`;
document.getElementById('partSizeLabel').textContent = `(파트당 약 ${Math.ceil(allWords.length / 4)}개)`;

// ────────────────────────────────────────────────
//  화면 전환
// ────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showStart() { showScreen('startScreen'); }

// ────────────────────────────────────────────────
//  퀴즈 시작
// ────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(partIdx) {
  currentPart = partIdx + 1;
  const shuffled = shuffle(allWords);
  const partSize = Math.ceil(shuffled.length / 4);
  const partWords = shuffled.slice(partIdx * partSize, (partIdx + 1) * partSize);
  quizWords = partWords.map(w => [w, Math.random() < 0.5]);
  current = 0;
  correctCount = 0;
  wrongWords = [];
  document.getElementById('partTag').textContent = 'Part ' + currentPart;
  showScreen('quizScreen');
  renderQuestion();
}

// ────────────────────────────────────────────────
//  문제 렌더링
// ────────────────────────────────────────────────
function renderQuestion() {
  const total = quizWords.length;
  const [q, isEnKr] = quizWords[current];

  // 진행바
  document.getElementById('progText').textContent = `${current + 1} / ${total}`;
  document.getElementById('scoreText').textContent = `✅ ${correctCount}`;
  document.getElementById('progFill').style.width = `${((current + 1) / total) * 100}%`;

  // 문제
  const questionText = isEnKr ? q[0] : q[1];
  const answerText   = isEnKr ? q[1] : q[0];

  const qLabel = document.getElementById('qLabel');
  const qWord  = document.getElementById('qWord');
  qLabel.textContent = isEnKr ? '다음 단어의 뜻은?' : '다음 뜻에 해당하는 단어는?';
  qWord.textContent  = questionText;
  qWord.className    = 'q-word' + (isEnKr ? '' : ' kr-mode');

  // 보기 4개 생성
  const correctIdx = isEnKr ? 1 : 0;
  const pool = shuffle(allWords.filter(w => w[correctIdx] !== answerText));
  const distractors = pool.slice(0, 3).map(w => w[correctIdx]);
  const choices = shuffle([answerText, ...distractors]);

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (isEnKr ? '' : ' en-choice');
    btn.textContent = ch;
    btn.onclick = () => handleAnswer(btn, ch, answerText, q);
    choicesEl.appendChild(btn);
  });
}

// ────────────────────────────────────────────────
//  정답 처리
// ────────────────────────────────────────────────
function handleAnswer(btn, selected, answer, word) {
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => b.disabled = true);

  if (selected === answer) {
    btn.classList.add('correct');
    correctCount++;
    setTimeout(nextQuestion, 250); // ✅ 0.25초 후 다음 문제
  } else {
    btn.classList.add('wrong');
    wrongWords.push(word);
    // 정답 강조
    allBtns.forEach(b => { if (b.textContent === answer) b.classList.add('correct'); });
    setTimeout(nextQuestion, 1000);
  }
}

function nextQuestion() {
  current++;
  if (current >= quizWords.length) showResult();
  else renderQuestion();
}

// ────────────────────────────────────────────────
//  결과 화면
// ────────────────────────────────────────────────
function showResult() {
  const total = quizWords.length;
  const pct = Math.round((correctCount / total) * 100);

  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('resultTitle').textContent =
    pct === 100 ? '완벽해요! 🎊' :
    pct >= 80  ? '훌륭해요! 🎉' :
    pct >= 60  ? '잘 했어요! 😊' : '더 연습해요! 💪';
  document.getElementById('resultStats').textContent =
    `${total}개 중 ${correctCount}개 정답 · 오답 ${wrongWords.length}개`;

  const wrongSection = document.getElementById('wrongSection');
  if (wrongWords.length === 0) {
    wrongSection.innerHTML = '<p style="text-align:center;color:#16a34a;padding:18px 0;font-size:1em;">🎊 모든 단어를 맞혔어요!</p>';
  } else {
    document.getElementById('wrongList').innerHTML =
      wrongWords.map(w =>
        `<div class="wrong-item">
          <span class="wi-en">${w[0]}</span>
          <span class="wi-kr">${w[1]}</span>
        </div>`
      ).join('');
  }

  showScreen('resultScreen');
}

// ────────────────────────────────────────────────
//  결과 복사 (카카오톡용)
// ────────────────────────────────────────────────
function copyResult() {
  const total = quizWords.length;
  const pct = Math.round((correctCount / total) * 100);

  let text = `📚 Week 4 단어 테스트 결과 (Part ${currentPart})\n`;
  text += `━━━━━━━━━━━━━━━━━\n`;
  text += `✅ 정답: ${correctCount}개  ❌ 오답: ${wrongWords.length}개\n`;
  text += `📊 정답률: ${pct}% (${total}문제)\n`;

  if (wrongWords.length > 0) {
    text += `\n❌ 틀린 단어 다시 보기:\n`;
    wrongWords.forEach(w => { text += `• ${w[0]} → ${w[1]}\n`; });
  } else {
    text += `\n🎊 모든 단어 완벽 정답!`;
  }

  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.textContent = '✅ 복사 완료! 카카오톡에 붙여넣기 하세요 😊';
    setTimeout(() => { msg.textContent = ''; }, 3000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const msg = document.getElementById('copiedMsg');
    msg.textContent = '✅ 복사 완료!';
    setTimeout(() => { msg.textContent = ''; }, 3000);
  });
}

// ────────────────────────────────────────────────
//  키보드 단축키 (숫자 1~4)
// ────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (!['1','2','3','4'].includes(e.key)) return;
  const idx = parseInt(e.key) - 1;
  const active = document.querySelector('.screen.active');
  if (!active) return;

  if (active.id === 'startScreen') {
    // 파트 선택 버튼
    const btns = active.querySelectorAll('.opt-btn');
    if (btns[idx]) btns[idx].click();
  } else if (active.id === 'quizScreen') {
    // 선택지 버튼 (비활성화 안된 것만)
    const btns = document.querySelectorAll('#choices .choice-btn:not([disabled])');
    if (btns[idx]) btns[idx].click();
  }
});
</script>
</body>
</html>
