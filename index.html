<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EngFit 단어 테스트 — Week 선택</title>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#1a3a8a; --pale:#eef2fb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f4f6fb;
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 14px; }
    .wrap { width:100%; max-width:480px; background:#fff; border:2.5px solid var(--blue);
            border-radius:20px; padding:36px 28px; box-shadow:0 6px 24px rgba(26,58,138,.10); }
    .brand { font-family:'Patrick Hand',cursive; color:var(--blue); opacity:.55; letter-spacing:2px;
             text-align:center; margin-bottom:6px; font-size:1.05em; }
    h1 { color:var(--blue); text-align:center; font-size:1.45em; margin-bottom:4px; }
    .sub { text-align:center; color:#777; font-size:.86em; margin-bottom:22px; }
    .week-card { display:block; text-decoration:none; border:2px solid var(--blue); border-radius:14px;
                 padding:14px 18px; margin-bottom:12px; background:var(--pale); transition:.15s; }
    .week-card:hover { background:var(--blue); }
    .week-card:hover .wk-num, .week-card:hover .wk-title, .week-card:hover .wk-count { color:#fff; }
    .wk-num { font-family:'Patrick Hand',cursive; color:var(--blue); letter-spacing:1.5px; font-size:.85em; opacity:.75; }
    .wk-title { color:#22315a; font-weight:700; font-size:1.02em; margin:2px 0; }
    .wk-count { color:#8a93ad; font-size:.8em; }
    .foot { text-align:center; color:#b6bdd1; font-size:.75em; margin-top:18px;
            font-family:'Patrick Hand',cursive; letter-spacing:1.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">EngFit</div>
    <h1>고1 모의고사 단어 테스트</h1>
    <div class="sub">2017년 고1 모의고사 유형별 모음 · Week 1~5</div>
      <a class="week-card" href="week1_quiz.html">
        <div class="wk-num">WEEK 1</div>
        <div class="wk-title">목적 · 실용문 · 도표 · 분위기 · 내용일치 · 지칭어</div>
        <div class="wk-count">449개 단어 · 파트 4개</div>
      </a>
      <a class="week-card" href="week2_quiz.html">
        <div class="wk-num">WEEK 2</div>
        <div class="wk-title">주제 · 요지 · 제목 · 주장</div>
        <div class="wk-count">355개 단어 · 파트 4개</div>
      </a>
      <a class="week-card" href="week3_quiz.html">
        <div class="wk-num">WEEK 3</div>
        <div class="wk-title">빈칸넣기</div>
        <div class="wk-count">344개 단어 · 파트 4개</div>
      </a>
      <a class="week-card" href="week4_quiz.html">
        <div class="wk-num">WEEK 4</div>
        <div class="wk-title">순서 · 넣기 · 무관한문장 · 요약문</div>
        <div class="wk-count">496개 단어 · 파트 4개</div>
      </a>
      <a class="week-card" href="week5_quiz.html">
        <div class="wk-num">WEEK 5</div>
        <div class="wk-title">장문독해</div>
        <div class="wk-count">241개 단어 · 파트 4개</div>
      </a>
    <div class="foot">EngFit</div>
  </div>
</body>
</html>
